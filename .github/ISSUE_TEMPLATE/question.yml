name: ❓ Question
description: Ask a question about FORT
title: "[Question]: "
labels: ["question"]
assignees:
  - AndartaMC

body:
  - type: markdown
    attributes:
      value: |
        Thanks for your question!
        Before asking, please check the modpack description and existing issues in case your question has already been answered.

  - type: textarea
    id: question
    attributes:
      label: What is your question?
      description: Please provide as much detail as possible.
      placeholder: |
        What would you like to know?
    validations:
      required: true

  - type: textarea
    id: additional-info
    attributes:
      label: Additional information
      description: |
        Include anything else that might help answer your question.
        You can drag and drop files directly into this report.
      placeholder: |
        Version, screenshots, examples, etc.
    validations:
      required: false